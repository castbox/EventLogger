apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

// 仓库配置已移至settings.gradle

android {
    namespace 'fm.eventlogger'
    compileSdkVersion 33 // 直接指定compileSdkVersion
    buildToolsVersion '33.0.2' // 直接指定buildToolsVersion
    defaultConfig {
        minSdkVersion 21 // 直接指定minSdkVersion
        targetSdkVersion 33 // 直接指定targetSdkVersion
        versionCode 1
        versionName "1.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation "com.google.firebase:firebase-analytics:$firebaseAnalyticsVersion"
    implementation "com.android.installreferrer:installreferrer:$installreferrerVersion"

    // facebook analytics
    implementation "com.jakewharton.timber:timber:$timberVersion"
}
